# ---- No display / no lights (the big battery drains) ----
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n

# ---- Sleep ----
# Deep sleep after 30 min idle; press a key to wake
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ---- Soft off ("power switch" in software) ----
# Hold the OFF key on the Raise layer to shut down; press RESET on each half to turn back on
CONFIG_ZMK_PM_SOFT_OFF=y

# ---- Wireless ----
# Stronger Bluetooth signal (better range/stability, slightly more battery)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Connection-stability fixes, helps a lot with Windows/Mac dropouts
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ---- Battery reporting ----
# Lets the computer see BOTH halves' battery, not just the left
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
